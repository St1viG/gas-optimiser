# Install once with: pre-commit install
# mypy runs in `make typecheck` and CI, not here — it needs the project env.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^foundry/lib/
      - id: end-of-file-fixer
        exclude: ^foundry/lib/
      - id: check-toml
      - id: check-yaml
