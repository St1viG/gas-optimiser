name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,ui]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy gas_optimizer

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # solc 0.8.20 is downloaded by forge on first use; cache it.
      - uses: actions/cache@v4
        with:
          path: ~/.svm
          key: svm-${{ runner.os }}-${{ hashFiles('foundry/foundry.toml') }}

      # forge-std is vendored, so no `forge install` step is needed.
      - name: Build the Foundry workspace
        working-directory: foundry
        run: forge build

      - run: pip install -e ".[dev,ui]"

      # The suite drives the loop with a scripted model; no HF_TOKEN required.
      - name: Run tests
        run: pytest -q

  controls:
    # The fixture pairs are the regression tests that matter most: each one has
    # a known verdict, and each corresponds to a soundness hole the harness used
    # to have. Run them through the real CLI, not just pytest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/cache@v4
        with:
          path: ~/.svm
          key: svm-${{ runner.os }}-${{ hashFiles('foundry/foundry.toml') }}

      # Warm up the workspace so the solc download does not eat into the
      # validator's own forge timeout.
      - name: Build the Foundry workspace
        working-directory: foundry
        run: forge build

      - run: pip install -e .

      - name: Run the fixture controls
        run: ./scripts/controls.sh
