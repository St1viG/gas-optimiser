[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"

solc_version = "0.8.20"

# The gas gate compares candidates against originals, so both must be compiled
# the way they would actually be deployed. With the optimizer off the numbers
# describe nothing real.
optimizer = true
optimizer_runs = 200

# storageLayout drives state seeding in the generated equivalence harness; it is
# not emitted in the default artifact.
extra_output = ["storageLayout"]

[fuzz]
runs = 1000
max_test_rejects = 65536

[invariant]
runs = 256
depth = 15
