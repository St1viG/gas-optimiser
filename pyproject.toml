[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gas-optimizer"
dynamic = ["version"]
description = "AI-powered Solidity gas optimizer with a generate-and-verify loop"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]

dependencies = [
    "huggingface_hub>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
tui = ["textual>=1.0"]
gui = ["fastapi>=0.115", "uvicorn>=0.30"]
ui = ["gas-optimizer[tui,gui]"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "httpx>=0.27",  # FastAPI TestClient
]

[project.scripts]
gas-optimize = "gas_optimizer.cli:main"

[tool.setuptools.dynamic]
version = { attr = "gas_optimizer.__version__" }

[tool.setuptools.packages.find]
include = ["gas_optimizer*"]

[tool.setuptools.package-data]
"gas_optimizer" = ["py.typed"]
"gas_optimizer.frontends.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "foundry: requires the `forge` binary and compiles Solidity (slow)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Vendored third-party tooling; not ours to style.
exclude = ["foundry/lib"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is content, not code — rewrapping it changes what the model reads.
"gas_optimizer/prompts.py" = ["E501"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["foundry", "build"]

# The clean core is held to the strict bar; frontends and the CLI follow.
[[tool.mypy.overrides]]
module = [
    "gas_optimizer.events",
    "gas_optimizer.settings",
    "gas_optimizer.runstore",
    "gas_optimizer.preflight",
    "gas_optimizer.render",
    "gas_optimizer.config",
    "gas_optimizer.utils",
    "gas_optimizer.verification.*",
]
disallow_untyped_defs = true
